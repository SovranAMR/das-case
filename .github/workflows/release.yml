name: Release DAS Case

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit

      - name: Build Next.js + Electron
        run: npm run electron:prep
        env:
          NODE_ENV: production

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Build installer (${{ matrix.platform }})
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: das-case-${{ matrix.platform }}
          path: release/*
          retention-days: 30
