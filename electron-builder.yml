appId: com.dassystems.dascase
productName: DAS Case
copyright: "© 2026 DAS Systems"

directories:
  output: release
  buildResources: assets

files:
  - dist-electron/**/*
  - .next/standalone/**/*
  - drizzle/**/*

extraResources:
  - from: .next/standalone
    to: app
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: "DASCase-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - Turkish
  language: 1055
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DAS Case
  license: LICENSE.txt
  include: scripts/installer.nsh

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.business
  artifactName: "DASCase-${version}-${arch}.${ext}"

dmg:
  title: "DAS Case ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: SovranAMR
  repo: das-case
  releaseType: release
