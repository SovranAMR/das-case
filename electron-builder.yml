appId: com.dassystems.dascase
productName: DAS Case
copyright: "© 2026 DAS Systems"

directories:
  output: release
  buildResources: assets

npmRebuild: false

files:
  - dist-electron/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*

asarUnpack:
  - node_modules/better-sqlite3/**/*

extraResources:
  - from: .next/standalone
    to: app
    filter:
      - "**/*"
  # electron-builder, bir klasoru extraResources olarak kopyalarken icindeki
  # node_modules'u atlar; standalone calismasi icin ayri entry ile zorluyoruz.
  - from: .next/standalone/node_modules
    to: app/node_modules
    filter:
      - "**/*"
  - from: assets
    to: app/assets
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  artifactName: "DASCase-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - tr_TR
  language: 1055
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DAS Case
  license: LICENSE.txt
  include: scripts/installer.nsh

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: assets/icon.png
  category: public.app-category.business
  artifactName: "DASCase-${version}-${arch}.${ext}"

dmg:
  title: "DAS Case ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: SovranAMR
  repo: das-case
  releaseType: release
